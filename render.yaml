services:
  - type: web
    name: phishhunter-live
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.enableCORS false --server.enableXsrfProtection false --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: database/phishhunter.db
      - key: HTTP_TIMEOUT
        value: "4.0"
      - key: MAX_REDIRECT_HOPS
        value: "7"
